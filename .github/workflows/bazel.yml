name: Bazel

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Test
        run: |
          cd examples
          bazel test //... --test_output=all

      - name: Test json (uncached test results)
        run: |
          cd examples
          bazel test --config=json //... --test_output=all --cache_test_results=no

      - name: Test failing test
        run: |
          cd examples
          ./verify_test_fails.sh
